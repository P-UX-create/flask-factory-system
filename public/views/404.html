<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    /* ── Theme Variables & Resets ────────────────────────────────────────── */
    :root {
      --bg-main: #0b0d10;
      --bg-card: #111418;
      --accent-gold: #ffb800;
      --accent-gold-hover: #e0a200;
      --text-main: #f3f4f6;
      --text-muted: #8a939e;
      --border-color: #22272e;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1.5rem;
    }

    /* ── Layout Containment ──────────────────────────────────────────────── */
    .error-container {
      text-align: center;
      max-width: 420px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Decorative cyber corner accent */
    .error-container::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 16px;
      height: 16px;
      border-top: 2px solid var(--accent-gold);
      border-left: 2px solid var(--accent-gold);
      border-top-left-radius: 12px;
    }

    /* ── Typography & Graphics ───────────────────────────────────────────── */
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      color: var(--accent-gold);
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(255, 184, 0, 0.15);
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .error-message {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    /* ── Action Interactive Controls ─────────────────────────────────────── */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background-color: var(--accent-gold);
      color: #000000;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-action:hover {
      background-color: var(--accent-gold-hover);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action focus-visible {
      outline: 2px solid var(--text-main);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Endpoint Out of Bounds</h2>
    <p class="error-message">The route you are trying to access does not exist or has been shifted in production.</p>
    
    <button id="returnDashboardBtn" class="btn-action">
      Return to Dashboard
    </button>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const returnBtn = document.getElementById('returnDashboardBtn');
      
      if (returnBtn) {
        returnBtn.addEventListener('click', () => {
            
          window.location.replace('/dashboard');
        });
      }
    });
  </script>

</body>
</html>
