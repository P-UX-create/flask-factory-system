<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Stockly</title>
    <meta
      name="description"
      content="Log in to your Stockly factory account."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="auth-header">
      <a href="/" class="logo">Stock<span>Ly</span></a>
    </header>

    <main id="main" class="auth-main">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="auth-sub">
          Welcome back. Enter your details to access your dashboard.
        </p>

        <div class="form-alert" id="formAlert" role="alert" hidden></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
                minlength="6"
              />
              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
            <a href="/forgot" class="forgot-link">Forgot password?</a>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="submitBtn"
          >
            <span class="btn-label">Log in</span>
            <span class="btn-spinner" hidden aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-switch">
          Don't have an account? <a href="signup">Sign up</a>
        </p>
      </div>
    </main>

    <footer class="auth-footer">
      <p>&copy; <span id="year"></span> Stockly. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
  </body>
</html>
